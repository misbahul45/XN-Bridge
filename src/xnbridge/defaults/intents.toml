[[intent]]
domain = "social"
name = "inspect"
stage = "inspect"
skill = "xn-social"
capabilities = ["social.account.list", "social.capability.read"]
groups = [
  ["\\b(linkedin|instagram|ig|tiktok|twitter|threads|reddit|facebook|fb|sosmed)\\b", "\\bx\\.com\\b", "\\b(media sosial|social media)\\b"],
  ["\\b(akun|accounts?|capabilit\\w*|kemampuan|status|connected|terhubung)\\b"],
]
negatives = [
  "\\b(lowongan|magang|internships?|intern|pkl|jobs?|apply|melamar|lamar|cv|resume|rekrutmen|hiring)\\b",
  "\\b(connect|hubungkan|sambungkan|login|authori[sz]e|otorisasi)\\w*",
]
