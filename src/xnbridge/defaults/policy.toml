
[limits]
max_tool_calls = 300
max_retries_per_step = 2
max_provider_switches = 3
max_stages = 12
workflow_deadline_s = 604800
max_browser_ops = 150
max_payload_bytes = 262144
max_entities_per_action = 500
max_rss_mb = 768
min_mem_available_mb = 300
max_cpu_load_per_core = 2.0
catalog_ttl_s = 21600
approval_ttl_s = 3600
stale_started_s = 120

[evidence_ttl_s]
listing = 259200
company = 2592000
default = 604800

[routing]
l1_enabled = false
l1_model = "qwen2.5:1.5b"
l1_url = "http://127.0.0.1:11434"
l1_timeout_s = 30
l1_min_mem_available_mb = 2500

[network]
offline = false
allowed_ats_hosts = [
  "boards-api.greenhouse.io",
  "api.lever.co",
  "api.ashbyhq.com",
]

[autonomy]
unattended_external_writes = false
max_external_per_day = 25
max_external_per_origin_per_day = 5
stop_file = "STOP_EXTERNAL"

[trust]
read_heuristic_servers = [
  "web_search", "paper_research", "markitdown", "context7", "codebase-memory-mcp",
  "sequential-thinking", "youtube_search",
]

