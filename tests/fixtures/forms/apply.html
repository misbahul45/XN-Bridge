<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Apply - Northwind Labs</title></head>
<body>
<h1>Apply: Backend Engineering Intern</h1>
<form id="apply" action="/submit" method="post" onsubmit="return false">
  <label for="name">Full name *</label>
  <input id="name" name="name" required>
  <label for="email">Email *</label>
  <input id="email" name="email" type="email" required>
  <label for="phone">Phone</label>
  <input id="phone" name="phone">
  <label for="uni">University *</label>
  <input id="uni" name="uni" required>
  <label for="gpa">GPA</label>
  <input id="gpa" name="gpa">
  <label for="country">Country of residence *</label>
  <select id="country" name="country" required>
    <option>Indonesia</option>
    <option>Singapore</option>
    <option>Malaysia</option>
  </select>
  <fieldset>
    <legend>Are you legally authorized to work in Indonesia? *</legend>
    <label><input type="radio" name="auth" value="yes"> Yes</label>
    <label><input type="radio" name="auth" value="no"> No</label>
  </fieldset>
  <label for="why">Why do you want this internship? *</label>
  <textarea id="why" name="why" required></textarea>
  <label for="cv">Upload your CV *</label>
  <input id="cv" name="cv" type="file" required>
  <label for="nick">Preferred nickname</label>
  <input id="nick" name="nick">
  <label><input type="checkbox" id="consent" name="consent"> I agree to the privacy policy and terms *</label>
  <button type="submit">Submit application</button>
</form>
</body>
</html>
